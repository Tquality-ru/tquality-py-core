[project]
name = "tquality-py-core"
dynamic = ["version"]
description = "Driver-agnostic core for tquality test automation (Selenium, Appium, WinAppDriver, etc.)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "testing",
    "test-automation",
    "qa",
    "selenium",
    "appium",
    "winappdriver",
    "page-object",
    "allure",
    "tquality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "dependency-injector>=4.41",
    "allure-python-commons>=2.13",
    "json5>=0.9",
    "pytest>=8.0",
]

[project.optional-dependencies]
screencast = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "Pillow>=10.0",
]
http_client = [
    "requests>=2.34",
    "urllib3>=2.0",
]
# Слой поверх http_client: разбор XML-ответов в pydantic-xml-модели (BaseXmlModel).
xml = [
    "tquality-py-core[http_client]",
    "pydantic-xml>=2.0",
]

[project.urls]
Homepage = "https://github.com/Tquality-ru/tquality-py-core"
Repository = "https://github.com/Tquality-ru/tquality-py-core"
Issues = "https://github.com/Tquality-ru/tquality-py-core/issues"
Changelog = "https://github.com/Tquality-ru/tquality-py-core/blob/master/CHANGELOG.md"

[project.scripts]
tquality-config = "tquality_core.cli:main"

[project.entry-points.pytest11]
tquality_core_per_test_files = "tquality_core.plugins.per_test_files"

[dependency-groups]
dev = [
    "ty>=0.0.54",
    "ruff>=0.14.0"
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Версия берется из последнего git-тега вида vX.Y.Z.
# Сборка вне git-репо (например, из sdist) возьмет версию из PKG-INFO.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "only-version"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/tquality_core/py.typed" = "tquality_core/py.typed"

# В sdist кладем только источники и документацию.
# Иначе CI-артефакты (.uv-cache, .venv) засасываются со внешними симлинками.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "schema",
    "scripts",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
markers = [
    "integration: тесты реальных интеграций (отключить: -m 'not integration')",
]

[tool.ty.environment]
python-version = "3.12"

# error-on-warning держит проверку строгой, как mypy strict: любые
# предупреждения (в т.ч. неиспользуемые `ty: ignore`) роняют проверку.
# pydantic v2 ty понимает нативно через dataclass_transform - плагин не нужен.
[tool.ty.terminal]
error-on-warning = true

# Аналог mypy ignore_missing_imports: пакеты без аннотаций/стабов не
# считаются ошибкой разрешения импорта.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "json5",
    "json5.**",
    # Опциональный extra `xml`; в окружении без него импорт мягко отключается.
    "pydantic_xml",
    "pydantic_xml.**",
]

[tool.ruff]
exclude = [".*", "__pycache__"]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
