[project]
name = "tquality-py-core"
dynamic = ["version"]
description = "Driver-agnostic core for tquality test automation (Selenium, Appium, WinAppDriver, etc.)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "testing",
    "test-automation",
    "qa",
    "selenium",
    "appium",
    "winappdriver",
    "page-object",
    "allure",
    "tquality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dependency-injector>=4.41",
    "allure-python-commons>=2.13",
    # json5 - парсер jsonc/json5: комментарии // и /* */, trailing commas
    # в config.json. Чистый Python.
    "json5>=0.9",
]

[project.urls]
Homepage = "https://github.com/Tquality-ru/tquality-py-core"
Repository = "https://github.com/Tquality-ru/tquality-py-core"
Issues = "https://github.com/Tquality-ru/tquality-py-core/issues"
Changelog = "https://github.com/Tquality-ru/tquality-py-core/blob/master/CHANGELOG.md"

[project.scripts]
tquality-config = "tquality_core.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Версия берется из последнего git-тега вида vX.Y.Z.
# Сборка вне git-репо (например, из sdist) возьмет версию из PKG-INFO.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "only-version"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/tquality_core/py.typed" = "tquality_core/py.typed"

# В sdist кладем только источники и документацию.
# Иначе CI-артефакты (.uv-cache, .venv) засасываются со внешними симлинками.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "schema",
    "scripts",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tquality_core", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["json5"]
ignore_missing_imports = true
