[project]
name = "tquality-py-core"
dynamic = ["version"]
description = "Driver-agnostic core for tquality test automation (Selenium, Appium, WinAppDriver, etc.)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "testing",
    "test-automation",
    "qa",
    "selenium",
    "appium",
    "winappdriver",
    "page-object",
    "allure",
    "tquality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "dependency-injector>=4.41",
    "allure-python-commons>=2.13",
    "json5>=0.9",
    "pytest>=8.0",
]

[project.optional-dependencies]
screencast = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "Pillow>=10.0",
]
http_client = [
    "requests>=2.34",
    "urllib3>=2.0",
]
# Слой поверх http_client: разбор XML-ответов в pydantic-xml-модели (BaseXmlModel).
xml = [
    "tquality-py-core[http_client]",
    "pydantic-xml>=2.0",
]

[project.urls]
Homepage = "https://github.com/Tquality-ru/tquality-py-core"
Repository = "https://github.com/Tquality-ru/tquality-py-core"
Issues = "https://github.com/Tquality-ru/tquality-py-core/issues"
Changelog = "https://github.com/Tquality-ru/tquality-py-core/blob/master/CHANGELOG.md"

[project.scripts]
tquality-config = "tquality_core.cli:main"

[project.entry-points.pytest11]
tquality_core_per_test_files = "tquality_core.plugins.per_test_files"

[dependency-groups]
dev = [
    "ty>=0.0.58",
    "ruff>=0.14.0"
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Версия берется из последнего git-тега вида vX.Y.Z.
# Сборка вне git-репо (например, из sdist) возьмет версию из PKG-INFO.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "only-version"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_core"]

# В sdist кладем только источники и документацию.
# Иначе CI-артефакты (.uv-cache, .venv) засасываются со внешними симлинками.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "schema",
    "scripts",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "NOTICE",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.pytest]
markers = [
    "integration: тесты реальных интеграций (отключить: -m 'not integration')",
]

[tool.ty.environment]
python-version = "3.12"

# error-on-warning держит проверку строгой, как mypy strict: любые
# предупреждения (в т.ч. неиспользуемые `ty: ignore`) роняют проверку.
# pydantic v2 ty понимает нативно через dataclass_transform - плагин не нужен.
[tool.ty.terminal]
error-on-warning = true

# Аналог mypy ignore_missing_imports: пакеты без аннотаций/стабов не
# считаются ошибкой разрешения импорта.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "json5",
    "json5.**",
    # Опциональный extra `xml`; в окружении без него импорт мягко отключается.
    "pydantic_xml",
    "pydantic_xml.**",
]

[tool.ty.rules]
# Каждый переопределяющий метод обязан нести `@typing.override` - явный
# override ловит рассинхрон с базовым классом (опечатка в имени, ушедшая
# сигнатура) на этапе проверки типов.
missing-override-decorator = "error"
# Запрет «голых» дженериков (`list` вместо `list[str]`, `BaseElement` вместо
# `BaseElement[...]`) - тип-аргумент обязателен.
missing-type-argument = "error"
# Доступ к атрибуту, которого может не быть на части union-вариантов.
possibly-missing-attribute = "error"
# Импорт, который может отсутствовать (условные/частичные импорты).
possibly-missing-import = "error"
# Использование имени, которое может быть не определено (use-before-def,
# условный bind).
possibly-unresolved-reference = "error"
# Динамический базовый класс (база - не статически известный тип).
unsupported-dynamic-base = "error"
# Деление на ноль. В ty выключено по умолчанию из-за ложноположительных;
# здесь 0 срабатываний, поэтому включаем.
division-by-zero = "error"

[tool.ruff]
exclude = [".*", "__pycache__"]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "A",        # flake8-builtins (затенение builtin-имён)
    "ASYNC",    # flake8-async
    "BLE",      # flake8-blind-except
    "FLY",      # flynt (static str.join -> f-string)
    "G",        # flake8-logging-format
    "ICN",      # flake8-import-conventions
    "INP",      # flake8-no-pep420 (отсутствие __init__.py)
    "INT",      # flake8-gettext
    "ISC",      # flake8-implicit-str-concat
    "LOG",      # flake8-logging
    "PIE",      # flake8-pie
    "PLE",      # pylint errors
    "PTH",      # flake8-use-pathlib
    "RET",      # flake8-return
    "RSE",      # flake8-raise
    "SLOT",     # flake8-slots
    "TID",      # flake8-tidy-imports
    "YTT",      # flake8-2020 (устаревшие sys.version проверки)
]

