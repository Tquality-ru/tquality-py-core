[project]
name = "tquality-py-core"
version = "0.1.0"
description = "Driver-agnostic core for tquality test automation (Selenium, Appium, WinAppDriver, etc.)"
requires-python = ">=3.12"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dependency-injector>=4.41",
    "allure-python-commons>=2.13",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_core"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tquality_core", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
