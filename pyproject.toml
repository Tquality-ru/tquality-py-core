[project]
name = "tquality-py-core"
version = "0.1.0"
description = "Driver-agnostic core for tquality test automation (Selenium, Appium, WinAppDriver, etc.)"
requires-python = ">=3.11"
authors = [{name = "ООО «Точка качества»"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "dependency-injector>=4.41",
    "allure-python-commons>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tquality_core"]
